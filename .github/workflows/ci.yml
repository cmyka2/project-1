name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Strict type-check
        run: ./scripts/analyze.sh

      - name: Unit + integration tests
        run: lune run tests/run

      - name: Build place
        run: rojo build default.project.json -o build/MonsterRoll.rbxl
